services:
  gateway:
    build: .
    # Host networking is required: the gateway creates VPN containers that
    # publish SOCKS5 ports on the host loopback (127.0.0.1:<port>).
    network_mode: host
    environment:
      - LISTEN_ADDR=:${GATEWAY_PORT:-8082}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-https://opencode.ai/zen/v1}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - UPSTREAM_API_KEYS=${UPSTREAM_API_KEYS}
      - UPSTREAM_PROVIDER=${UPSTREAM_PROVIDER:-zen}
      - OPENCODE_SERVER_URL=${OPENCODE_SERVER_URL:-http://127.0.0.1:4096}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENCODE_PROVIDER_ID=${OPENCODE_PROVIDER_ID}
      - OPENCODE_MODEL=${OPENCODE_MODEL}
      - OPENCODE_CLI_MODEL=${OPENCODE_CLI_MODEL}
      - OPENCODE_CLI_PROVIDER_ENV=${OPENCODE_CLI_PROVIDER_ENV:-ANTHROPIC_API_KEY}
      - OPENCODE_CLI_ARGS=${OPENCODE_CLI_ARGS}
      - OPENCODE_CLI_MODELS=${OPENCODE_CLI_MODELS}
      - PROXY_POOL_SIZE=${PROXY_POOL_SIZE:-10}
      - PROXY_BASE_PORT=${PROXY_BASE_PORT:-10801}
      - VPN_IMAGE=${VPN_IMAGE:-ghcr.io/tprasadtp/protonwire:latest}
      - PROTONVPN_USERNAME=${PROTONVPN_USERNAME}
      - PROTONVPN_PASSWORD=${PROTONVPN_PASSWORD}
      - PROTONVPN_API_BASE=${PROTONVPN_API_BASE:-https://account.protonvpn.com}
      - PROTONVPN_VPN_API_BASE=${PROTONVPN_VPN_API_BASE:-https://vpn-api.proton.me}
      - PROTONVPN_STORE_PATH=/app/data/protonvpn.db
      - PROTONVPN_REGIONS=${PROTONVPN_REGIONS:-NL,US,JP,DE}
      - PROTONVPN_IP_CHECK_URL=${PROTONVPN_IP_CHECK_URL:-https://icanhazip.com/}
      - RATE_LIMIT_COOLDOWN=${RATE_LIMIT_COOLDOWN:-5m}
      - RATE_LIMIT_RETRY_AFTER=${RATE_LIMIT_RETRY_AFTER:-60}
      - IP_BAN_DURATION=${IP_BAN_DURATION:-10m}
      - RATE_LIMIT_FRESH_IP_WAIT=${RATE_LIMIT_FRESH_IP_WAIT:-90s}
      - HEALTH_CHECK_PERIOD=${HEALTH_CHECK_PERIOD:-30s}
      - RESOURCE_CPU_LIMIT=${RESOURCE_CPU_LIMIT:-0.25}
      - RESOURCE_MEMORY_LIMIT=${RESOURCE_MEMORY_LIMIT:-512M}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BASE_DELAY=${RETRY_BASE_DELAY:-1s}
      - RETRY_MAX_DELAY=${RETRY_MAX_DELAY:-30s}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-100}
      - STICKY_SESSION_TTL=${STICKY_SESSION_TTL:-10m}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60s}
      - METRICS_DB_PATH=/app/data/metrics.db
      - MODEL_FILTER=${MODEL_FILTER:--free}
      - GATEWAY_PORT=${GATEWAY_PORT:-8082}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/app/data
    group_add:
      - "990" # docker group for socket access
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${GATEWAY_PORT:-8082}/api/metrics > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gateway-data:
